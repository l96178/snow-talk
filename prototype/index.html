<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>雪語 · 滑雪對講機 UI 原型</title>
<style>
  :root {
    --bg: #0b1220;
    --surface: #131c2e;
    --surface-2: #1b2740;
    --line: #26344f;
    --text: #f2f6ff;
    --text-dim: #9fb0cc;
    --accent: #5cc8ff;
    --accent-ink: #04202e;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --speak: #5cc8ff;
    --radius: 20px;
    --tap: 60px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.45 -apple-system, "SF Pro Text", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    min-height: 100dvh;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 480px; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }
  h1 { font-size: 28px; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--text-dim); }
  button {
    font: inherit; color: inherit; border: 0; cursor: pointer;
    min-height: var(--tap); border-radius: var(--radius); padding: 0 20px;
    background: var(--surface-2); font-weight: 600;
  }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .danger { background: transparent; color: var(--bad); border: 2px solid var(--bad); }
  .hidden { display: none !important; }

  /* cue banner: mirrors the audio cue played in the earbuds */
  .cue {
    position: sticky; top: 8px; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 16px; font-weight: 600;
    opacity: 0; transform: translateY(-8px); transition: .2s;
    pointer-events: none;
  }
  .cue.show { opacity: 1; transform: none; }

  /* home */
  .home { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .brand p { margin-top: 6px; }
  .stack { display: grid; gap: 12px; }
  .stack button { font-size: 20px; min-height: 72px; }

  /* join keypad */
  .code-display { display: flex; gap: 10px; justify-content: center; }
  .code-display span {
    width: 64px; height: 76px; border-radius: 16px; background: var(--surface);
    border: 2px solid var(--line); display: grid; place-items: center;
    font-size: 36px; font-weight: 700;
  }
  .code-display span.on { border-color: var(--accent); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keypad button { min-height: 72px; font-size: 26px; background: var(--surface); }

  /* team */
  .team-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .code-chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-weight: 700; letter-spacing: .15em;
  }
  .roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .member {
    display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px;
    background: var(--surface); border: 2px solid transparent;
    border-radius: var(--radius); padding: 12px 14px; min-height: 76px;
  }
  .member.speaking { border-color: var(--speak); box-shadow: 0 0 0 4px rgba(92,200,255,.18); }
  .member.offline { opacity: .5; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2);
    display: grid; place-items: center; font-size: 22px; font-weight: 700; position: relative;
  }
  .member.speaking .avatar { background: var(--speak); color: var(--accent-ink); }
  .name { font-weight: 700; font-size: 19px; }
  .sub { font-size: 14px; color: var(--text-dim); }
  .sub .tag { font-weight: 700; }
  .signal { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
  .signal i { width: 6px; border-radius: 2px; background: var(--line); display: block; }
  .signal i:nth-child(1) { height: 7px; } .signal i:nth-child(2) { height: 12px; }
  .signal i:nth-child(3) { height: 18px; } .signal i:nth-child(4) { height: 26px; }
  .signal.lv-good i.on { background: var(--good); }
  .signal.lv-mid i.on { background: var(--warn); }
  .signal.lv-bad i.on { background: var(--bad); }

  .controls { margin-top: auto; display: grid; gap: 12px; padding-top: 8px; }
  .mic {
    min-height: 96px; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: var(--accent); color: var(--accent-ink);
  }
  .mic.muted { background: var(--surface-2); color: var(--text); border: 2px solid var(--bad); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  details.demo { background: var(--surface); border-radius: var(--radius); padding: 4px 14px; }
  details.demo summary { min-height: 48px; display: flex; align-items: center; color: var(--text-dim); cursor: pointer; }
  details.demo .row { padding-bottom: 12px; }
  details.demo button { min-height: 52px; font-size: 15px; }

  @media (prefers-reduced-motion: no-preference) {
    .member.speaking .avatar { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
  }
</style>
</head>
<body>
<main class="app">
  <div class="cue" id="cue" role="status" aria-live="polite"><span aria-hidden="true">🔊</span><span id="cueText"></span></div>

  <!-- HOME -->
  <section class="home" id="home">
    <div class="brand">
      <h1>雪語</h1>
      <p>滑雪團隊免網路對講。上纜車前設好，之後戴手套也不用碰螢幕。</p>
    </div>
    <div class="stack">
      <button class="primary" id="btnCreate">建立隊伍</button>
      <button id="btnJoin">輸入代碼加入</button>
    </div>
  </section>

  <!-- JOIN -->
  <section class="hidden" id="join" style="display:flex;flex-direction:column;gap:24px;flex:1;justify-content:center">
    <div>
      <h2>輸入隊伍代碼</h2>
      <p>請隊長把 4 位數代碼念給你，或掃他的 QR code。</p>
    </div>
    <div class="code-display" id="codeDisplay" aria-live="polite"></div>
    <div class="keypad" id="keypad"></div>
    <button id="btnJoinBack">返回</button>
  </section>

  <!-- TEAM -->
  <section class="hidden" id="team" style="display:flex;flex-direction:column;gap:16px;flex:1">
    <div class="team-head">
      <div>
        <h2>我們的隊伍</h2>
        <p id="teamSummary"></p>
      </div>
      <div class="code-chip" id="teamCode"></div>
    </div>
    <ul class="roster" id="roster"></ul>

    <details class="demo">
      <summary>模擬事件（僅原型用）</summary>
      <div class="row">
        <button id="simJoin">有人加入</button>
        <button id="simLeave">有人離線</button>
        <button id="simWeak">訊號變弱</button>
        <button id="simRelay">改走接力</button>
      </div>
    </details>

    <div class="controls">
      <button class="mic" id="btnMic" aria-pressed="false"><span id="micIcon" aria-hidden="true">🎙️</span><span id="micText">麥克風開啟中</span></button>
      <button class="danger" id="btnLeave">離開隊伍</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var NAMES = ["小明", "小華", "阿凱", "Emma", "老王", "小美"];

  var state = { code: "", digits: "", muted: false, members: [], speakerId: null, nextName: 0 };
  var audioCtx = null, cueTimer = null, speakTimer = null;

  /* ---------- helpers ---------- */
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function show(id) {
    ["home", "join", "team"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); });
  }
  function level(sig) { return sig >= 3 ? "good" : sig === 2 ? "mid" : "bad"; }
  function sigLabel(sig) { return sig >= 3 ? "訊號良好" : sig === 2 ? "訊號普通" : "訊號弱"; }

  /* audio cue: short beep + banner. In the real app this is a spoken cue in the earbuds. */
  function beep(freq) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; g.gain.value = 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.12);
    } catch (e) { /* audio unavailable: banner alone still works */ }
  }
  function cue(text, freq) {
    $("cueText").textContent = text;
    $("cue").classList.add("show");
    beep(freq || 660);
    clearTimeout(cueTimer);
    cueTimer = setTimeout(function () { $("cue").classList.remove("show"); }, 2800);
  }

  /* ---------- roster ---------- */
  function addMember(name, sig, via) {
    state.members.push({ id: state.members.length + 1, name: name, signal: sig, via: via || null, online: true });
  }
  function render() {
    var online = state.members.filter(function (m) { return m.online; }).length;
    $("teamSummary").textContent = online + " 人在線 / 共 " + state.members.length + " 人";
    $("teamCode").textContent = state.code;
    $("roster").innerHTML = state.members.map(function (m) {
      var speaking = state.speakerId === m.id && m.online;
      var cls = "member" + (speaking ? " speaking" : "") + (m.online ? "" : " offline");
      var sub;
      if (m.id === 1) sub = state.muted ? '<span class="tag" style="color:var(--bad)">已靜音</span>' : "麥克風開啟";
      else if (!m.online) sub = "離線，嘗試重新連線…";
      else if (speaking) sub = '<span class="tag" style="color:var(--speak)">說話中</span>';
      else sub = (m.via ? "經由 " + esc(m.via) + " 接力" : "直連") + " · " + sigLabel(m.signal);
      var sig = m.online && m.id !== 1
        ? '<div class="signal lv-' + level(m.signal) + '" role="img" aria-label="' + sigLabel(m.signal) + '">' +
          [1, 2, 3, 4].map(function (i) { return '<i class="' + (i <= m.signal ? "on" : "") + '"></i>'; }).join("") + "</div>"
        : "<div></div>";
      return '<li class="' + cls + '"><div class="avatar" aria-hidden="true">' + esc(m.name.charAt(0)) +
        '</div><div><div class="name">' + esc(m.name) + '</div><div class="sub">' + sub +
        "</div></div>" + sig + "</li>";
    }).join("");
  }

  /* ---------- flows ---------- */
  function enterTeam(code, asLeader) {
    state.code = code; state.muted = false; state.nextName = 0; state.speakerId = null;
    state.members = [];
    addMember("我", 4);
    // demo roster: a couple of teammates already in the team
    addMember(NAMES[state.nextName++], 4);
    addMember(NAMES[state.nextName++], 3);
    updateMic(); render(); show("team");
    cue(asLeader ? "隊伍已建立，代碼 " + code : "已加入隊伍", 880);
    startDemoSpeaker();
  }
  function updateMic() {
    $("btnMic").classList.toggle("muted", state.muted);
    $("btnMic").setAttribute("aria-pressed", String(state.muted));
    $("micIcon").textContent = state.muted ? "🔇" : "🎙️";
    $("micText").textContent = state.muted ? "已靜音，點一下開啟" : "麥克風開啟中";
  }
  function startDemoSpeaker() {
    clearInterval(speakTimer);
    speakTimer = setInterval(function () {
      var others = state.members.filter(function (m) { return m.online && m.id !== 1; });
      if (!others.length) return;
      state.speakerId = others[Math.floor(Math.random() * others.length)].id;
      render();
      setTimeout(function () { state.speakerId = null; render(); }, 1600);
    }, 4200);
  }

  /* ---------- keypad ---------- */
  function renderCode() {
    $("codeDisplay").innerHTML = [0, 1, 2, 3].map(function (i) {
      return '<span class="' + (i === state.digits.length ? "on" : "") + '">' + (state.digits[i] || "") + "</span>";
    }).join("");
  }
  function buildKeypad() {
    var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "清除", "0", "⌫"];
    $("keypad").innerHTML = keys.map(function (k) { return '<button data-k="' + k + '">' + k + "</button>"; }).join("");
    $("keypad").addEventListener("click", function (e) {
      var k = e.target.getAttribute && e.target.getAttribute("data-k");
      if (!k) return;
      if (k === "清除") state.digits = "";
      else if (k === "⌫") state.digits = state.digits.slice(0, -1);
      else if (state.digits.length < 4) state.digits += k;
      renderCode();
      if (state.digits.length === 4) setTimeout(function () { enterTeam(state.digits, false); }, 250);
    });
  }

  /* ---------- wiring ---------- */
  $("btnCreate").onclick = function () {
    enterTeam(String(Math.floor(1000 + Math.random() * 9000)), true);
  };
  $("btnJoin").onclick = function () { state.digits = ""; renderCode(); show("join"); };
  $("btnJoinBack").onclick = function () { show("home"); };
  $("btnMic").onclick = function () {
    state.muted = !state.muted; updateMic(); render();
    cue(state.muted ? "麥克風已靜音" : "麥克風已開啟", state.muted ? 440 : 660);
  };
  $("btnLeave").onclick = function () {
    clearInterval(speakTimer); state.members = []; show("home"); cue("已離開隊伍", 440);
  };

  $("simJoin").onclick = function () {
    if (state.nextName >= NAMES.length) return;
    var n = NAMES[state.nextName++]; addMember(n, 3); render(); cue(n + " 加入", 880);
  };
  $("simLeave").onclick = function () {
    var cand = state.members.filter(function (m) { return m.online && m.id !== 1; });
    if (!cand.length) return;
    var m = cand[cand.length - 1]; m.online = false; render(); cue(m.name + " 離線", 330);
  };
  $("simWeak").onclick = function () {
    var cand = state.members.filter(function (m) { return m.online && m.id !== 1; });
    if (!cand.length) return;
    var m = cand[0]; m.signal = 1; render(); cue(m.name + " 訊號弱", 440);
  };
  $("simRelay").onclick = function () {
    var cand = state.members.filter(function (m) { return m.online && m.id !== 1; });
    if (cand.length < 2) return;
    cand[cand.length - 1].via = cand[0].name; cand[cand.length - 1].signal = 3; render();
    cue(cand[cand.length - 1].name + " 改由 " + cand[0].name + " 接力", 660);
  };

  buildKeypad(); renderCode(); show("home");
})();
</script>
</body>
</html>
